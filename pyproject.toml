[project]
name = "gh-review-tool"
version = "0.1.0"
description = "Local GitHub PR review dashboard with pluggable AI backend (opencode, Claude Code)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.34",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23", "httpx>=0.27", "ruff>=0.8"]

[tool.ruff]
line-length = 120
target-version = "py312"
# claude_skills/ is bundled Agent-Skill payload (SKILL.md + helper scripts),
# not application source. Its scripts are authored/generated to their own
# standards, so the app's lint rules shouldn't gate CI on them — exclude the
# whole tree (and keep new skills from breaking `ruff check .`).
extend-exclude = ["claude_skills"]

[tool.ruff.lint]
select = ["E", "F", "W", "B"]
# E501: long prompt/log lines are intentional.
# B008: `svc: X = Depends(...)` is the canonical FastAPI injection idiom.
ignore = ["E501", "B008"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
